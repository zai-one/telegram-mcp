[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "zai-telegram-mcp"
version = "0.2.0"
description = "Standalone governed Telegram MCP with pinned upstream"
readme = "README.md"
license = "LicenseRef-ZAI-ONE"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastmcp==4.0.0",
  "mcp==2.1.1",
  "mcp-types==2.1.1",
  "pydantic==2.13.4",
  "starlette==1.3.1",
  "uvicorn==0.51.0",
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "nest-asyncio==1.6.0",
  "python-dotenv==1.2.2",
  "python-json-logger==3.3.0",
  "qrcode==8.2",
  "telethon==1.44.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.15.21"]

[project.scripts]
zai-telegram-mcp = "zai_telegram.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zai_telegram"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["src/zai_telegram/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[project.urls]
Homepage = "https://github.com/zai-one/telegram-mcp"
Issues = "https://github.com/zai-one/telegram-mcp/issues"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "contracts", "examples", "docs", "pyproject.toml", "uv.lock", "README.md", "README.ru.md", "INSTALL.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "mcp.example.json", ".env.example", "SOURCE_PROVENANCE.json", "third_party", "vendor"]
